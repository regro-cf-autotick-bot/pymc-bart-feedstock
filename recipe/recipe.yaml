schema_version: 1

context:
  name: pymc-bart
  version: "0.13.1"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pymc_bart-${{ version }}.tar.gz
  sha256: dacc7f04324a9e049ffd919e30adf56e573ca2ecd8983b548fba4b36350cb7af

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pymc >=6.0.0,<7.0.0
    - arviz-stats >=1.1.0,<2.0.0
    - numba
    - matplotlib-base
    - numpy >=2.0

tests:
  - python:
      imports:
        - pymc_bart
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - 3.*

about:
  summary: Bayesian Additive Regression Trees for Probabilistic programming with PyMC
  license: Apache-2.0
  license_file: LICENSE
  homepage: http://github.com/pymc-devs/pymc-bart

extra:
  recipe-maintainers:
    - ricardoV94
    - aloctavodia
    - maresb
